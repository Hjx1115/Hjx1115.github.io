<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑步火柴人</title>
    <style>
        html {
            font-size: 16px;
        }

        body {
            background-color: black;
        }

        .container {
            height: 18.75rem;
            width: 18.75rem;
            margin: 3.125rem;

        }

        .person {
            position: absolute;
            left: 9.375rem;
            top: 10rem;
            animation: run 5s infinite ease-in;
        }

        .head {
            position: absolute;
            width: 1.875rem;
            height: 1.875rem;
            border: .3125rem solid #fff;
            border-radius: 50%;
            top: -1.875rem;
            left: -0.375rem;
            animation: head 2s alternate infinite;
        }

        .torso {
            width: 0;
            height: 3.75rem;
            border-left: .3125rem solid #fff;
            position: absolute;
            left: 0;
            top: .9375rem;
        }

        .person .part {
            position: absolute;
            left: 0;
            top: 4.6875rem;
        }

        .person .part.arm {
            width: 2.5rem;
            height: 2.8125rem;
            border-left: .3125rem solid #fff;
            border-bottom: .3125rem solid #fff;
            position: absolute;
            top: .9375rem;
            right: 18.75rem;
            transform-origin: 0% 0% 0rem;
            animation: arm 1s ease-in-out infinite;
        }

        .person .part.arm.one {
            transform: rotate3d(0, 0, 1, 80deg);

        }

        .person .part.arm.two {
            transform: rotate3d(0, 0, 1, -80deg);
            animation-delay: -0.5s;
        }

        .person .part.leg {
            height: 3.75rem;
            width: 3.75rem;
            border-right: .3125rem solid #fff;
            border-top: .3125rem solid #fff;
            transform-origin: 0% 0% 0rem;
            animation: leg 1s ease-in-out infinite;
        }

        .person .part.leg.one {
            transform: rotate3d(0, 0, 1, 100deg);
        }

        .person .part.leg.two {
            transform: rotate3d(0, 0, 1, 10deg);
            animation-delay: -0.5s;
        }

        /*头部动画*/
        @keyframes head {
            0% {
                transform: rotate3d(0, 0, 1, 5deg);
            }

            25% {
                transform: rotate3d(0, 0, 1, -30deg) skew(15deg, 0deg);
            }

            50% {
                transform: rotate3d(0, 0, 1, -30deg);
            }

            75% {
                transform: rotate3d(0, 0, 1, -30deg) skew(15deg, 0deg);
            }

            100% {
                transform: rotate3d(0, 0, 1, 20deg) skew(15deg, 0deg);
            }
        }

        /*胳膊摆动*/
        @keyframes arm {
            0% {
                transform: rotate3d(0, 0, 1, 80deg);
            }

            50% {
                transform: rotate3d(0, 0, 1, -70deg);
            }

            100% {
                transform: rotate3d(0, 0, 1, 80deg);
            }
        }

        /*腿摆动*/
        @keyframes leg {
            0% {
                transform: rotate3d(0, 0, 1, -5deg);
            }

            50% {
                transform: rotate3d(0, 0, 1, 150deg);
            }

            100% {
                transform: rotate3d(0, 0, 1, -5deg);
            }
        }

        /*向前跑*/
        @keyframes run {
            0% {
                transform: translate(-12.5rem, 0rem);
            }

            100% {
                transform: translate(112.5rem, 0rem);
            }
        }
    </style>
</head>

<body>
    <!--火柴人结构-->
    <div class="container">
        <div class="person">
            <div class="head"></div>
            <div class="part arm one"></div>
            <div class="part arm two"></div>
            <div class="torso"></div>
            <div class="part leg one"></div>
            <div class="part leg two"></div>
        </div>
    </div>
</body>

</html>
